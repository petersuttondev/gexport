[project]
name = "gexport"
version = "0.5.0"
description = "Manifest-driven batch post-process and exporter for GIMP"
readme = "README.md"
authors = [{ name = "Peter Sutton", email = "peter@foxdogstudios.com" }]
requires-python = ">=3.14"
dependencies = ["PyGObject", "pydantic", "pyyaml", "rich"]

[dependency-groups]
dev = ["cleek"]

[project.scripts]
gexport = "gexport.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pyright]
reportUnusedCallResult = false

[tool.ruff]
line-length = 80
